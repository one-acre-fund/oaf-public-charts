{{- /*
OAF change: this Secret is rendered from .Values.env.*, so managing the chart
from git meant committing ADMIN_PASSWORD, KUMA_PASSWORD and SECRET_KEY in
cleartext. With secret.create=false the chart skips it and an ExternalSecret
owns the same name instead; the Deployment's envFrom picks it up either way.
create: true — the default — keeps upstream behaviour unchanged.
*/ -}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
    name:  {{ include "uptime-wrapper.fullname" . }}-secret
type: Opaque
data:
    ADMIN_PASSWORD: {{ .Values.env.ADMIN_PASSWORD | b64enc }}
    KUMA_PASSWORD: {{ .Values.env.KUMA_PASSWORD | b64enc }}
    SECRET_KEY: {{ .Values.env.SECRET_KEY | b64enc }}
{{- end }}
