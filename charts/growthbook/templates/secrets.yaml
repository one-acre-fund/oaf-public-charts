{{- if .Values.growthbookSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "growthbook.secretName" . }}
  labels:
    {{- include "growthbook.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /*
  Everything below only renders when growthbookSecret.create is true, i.e. when
  this chart is the source of these credentials — so they are required rather
  than defaulted. Defaulting them here would render a Secret full of empty
  strings and let a misconfigured release start with no JWT secret or database
  URI. When create is false the whole template is skipped and the values are
  expected to be absent.
  */}}
  MONGODB_URI: {{ include "growthbook.mongo.uri" . | required "growthbook.mongo.uri is empty: set mongodb.enabled with mongodb.auth.*, or growthbook.externalMongodbUri" | b64enc | quote }}
  JWT_SECRET: {{ .Values.growthbook.jwtSecret | required "growthbook.jwtSecret is required when growthbookSecret.create is true" | b64enc | quote }}
  ENCRYPTION_KEY: {{ .Values.growthbook.encryptionKey | required "growthbook.encryptionKey is required when growthbookSecret.create is true" | b64enc | quote }}
  {{- if .Values.growthbook.email.enabled }}
  {{- /* Optional: an SMTP relay may accept unauthenticated mail. */}}
  EMAIL_HOST_PASSWORD: {{ .Values.growthbook.email.hostPassword | default "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.growthbook.sso.enabled }}
  LICENSE_KEY: {{ .Values.growthbook.sso.licenseKey | required "growthbook.sso.licenseKey is required when growthbook.sso.enabled is true" | b64enc | quote }}
  {{- end }}
stringData:
  {{- if .Values.growthbook.sso.enabled }}
  SSO_CONFIG: {{ .Values.growthbook.sso.ssoConfig | required "growthbook.sso.ssoConfig is required when growthbook.sso.enabled is true" | toJson | quote }}
  {{- end }}
{{- end }}
