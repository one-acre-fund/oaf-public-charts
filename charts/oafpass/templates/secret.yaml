{{- if and .Values.secret.create (not .Values.secret.name) -}}
{{/*
Every credential the containers read, in one Secret. Set `secret.create=false`
and have an ExternalSecret own a Secret of this name to keep these out of git —
the containers read it the same way either way.
*/}}
{{- $data := dict -}}
{{- if eq .Values.auth.mode "oauth2-proxy" -}}
  {{- $_ := set $data .Values.secretKeys.oauth2ProxyClientId (required "secret.oauth2ProxyClientId is required when auth.mode=oauth2-proxy and secret.create=true" .Values.secret.oauth2ProxyClientId) -}}
  {{- $_ := set $data .Values.secretKeys.oauth2ProxyClientSecret (required "secret.oauth2ProxyClientSecret is required when auth.mode=oauth2-proxy and secret.create=true" .Values.secret.oauth2ProxyClientSecret) -}}
  {{- $_ := set $data .Values.secretKeys.oauth2ProxyCookieSecret .Values.secret.oauth2ProxyCookieSecret -}}
{{- end -}}
{{- if eq .Values.auth.mode "oidc" -}}
  {{- $_ := set $data .Values.secretKeys.oidcClientSecret (required "secret.oidcClientSecret is required when auth.mode=oidc and secret.create=true" .Values.secret.oidcClientSecret) -}}
  {{- $_ := set $data .Values.secretKeys.licenseKey (coalesce .Values.secret.licenseKey .Values.license.key) -}}
  {{- with .Values.secret.oidcSessionKey -}}
    {{- $_ := set $data $.Values.secretKeys.oidcSessionKey . -}}
  {{- end -}}
{{- end -}}
{{- with .Values.secret.apiToken -}}
  {{- $_ := set $data $.Values.secretKeys.apiToken . -}}
{{- end -}}
{{- if and (eq .Values.database.type "redis") .Values.secret.redisUrl -}}
  {{- $_ := set $data .Values.database.redis.existingSecretUrlKey .Values.secret.redisUrl -}}
{{- end -}}
{{- if $data -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oafpass.secretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "oafpass.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end -}}
{{- end }}
